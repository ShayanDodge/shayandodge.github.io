{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon"
      sizes="180x180"
      href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>

<!-- SVG favicon -->
<link rel="icon"
      type="image/svg+xml"
      href="{{ base_path }}/images/favicon.svg"/>

<!-- PNG favicons -->
<link rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ base_path }}/images/favicon-32x32.png"/>

<link rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ base_path }}/images/favicon-16x16.png"/>

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="{{ base_path }}/images/favicon-192x192.png"/>

<!-- ICO fallback -->
<link rel="shortcut icon"
      href="{{ base_path }}/images/favicon.ico"/>

<!-- Web App Manifest -->
<link rel="manifest"
      href="{{ base_path }}/images/manifest.json"/>

<!-- Browser theme color -->
<meta name="theme-color" content="#2563EB"/>

<!-- end custom head snippets -->
